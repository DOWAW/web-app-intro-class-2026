<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゲーム進捗メモ</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>ゲーム進捗メモ</h1>
      <p class="header-sub">プレイ中のゲームと、デイリーの管理</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="game-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 入力エリア -->
      <!-- 入力欄はテーブルのカラムと1対1で対応している（title / hardware / kind） -->
      <form id="game-form" class="input-area">
        <input
          type="text"
          id="game-input"
          class="game-input"
          placeholder="ゲーム名を入力..."
          maxlength="100"
          autocomplete="off"
        />
        <div class="input-row">
          <!-- Level 2 で追加した hardware カラムに対応する入力欄 -->
          <input
            type="text"
            id="hardware-input"
            class="hardware-input"
            placeholder="ハード名（例: Switch2）"
            maxlength="30"
            autocomplete="off"
          />
          <!-- Level 2 で追加した kind カラムに対応する選択欄。
               value が、そのままサーバーに送る値になる -->
          <select id="kind-input" class="kind-input">
            <option value="clear">プレイ中</option>
            <option value="daily">デイリー</option>
          </select>
          <button type="submit" class="game-button">追加</button>
        </div>
      </form>

      <!-- Level 3 その1: 絞り込みボタン -->
      <!-- data-filter の値を app.js 側で読み取って、表示するものを切り替える -->
      <div class="filter-area">
        <button type="button" class="filter-button active" data-filter="all">
          すべて
        </button>
        <button type="button" class="filter-button" data-filter="clear">
          プレイ中
        </button>
        <button type="button" class="filter-button" data-filter="daily">
          デイリー
        </button>
      </div>

      <!-- 件数表示と、並び替え/リセットを左右に置く行 -->
      <div class="tool-row">
        <!-- Level 3 その2: 件数表示。中身は app.js が書き込む -->
        <p id="count-text" class="count-text"></p>

        <div class="tool-actions">
          <!-- Level 3 その3: 並び替え。選ばれた値を ?sort= でサーバーに送る -->
          <select id="sort-input" class="sort-input">
            <option value="id">登録順</option>
            <option value="done">未消化を上に</option>
            <option value="title">名前順</option>
          </select>

          <!-- Level 3 その4: デイリーのチェックをまとめて外す -->
          <button type="button" id="reset-button" class="reset-button">
            デイリーをリセット
          </button>
        </div>
      </div>

      <!-- ゲーム一覧 -->
      <ul id="game-list" class="game-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 ゲーム進捗メモ</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
